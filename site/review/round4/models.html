<p class="kicker"><a href="../">Review</a> · Round 4 · model sheets</p><h1>Model sheets</h1>
<p>A first pass at every design in the plan, each built from the text, whose words are on the sheet beside it, and
drawn in the medium of <a href="./">the style frames</a>. Each still links to the full-size sheet. The questions are in
section 5 of the <a href="https://github.com/curtcox/The-Last-Evolution/blob/main/review/round4.md">decision sheet</a>.</p>
<figure><a href="img/model1-47f18932.jpg"><img src="img/model1-47f18932.jpg" alt="The people of 2538" loading="lazy"></a><figcaption><b>The people of 2538.</b> Roal, Trest, Kahsh and a citizen, front view, six feet tall, with the heads of Roal and Trest larger. Tunics, belts, boots and the standing collar of the pulps' futures; Roal in a long robe and a white beard; Kahsh in a ruler's mantle and a tall collar, with a disc of office.</figcaption></figure>
<figure><a href="img/model2-a1915937.jpg"><img src="img/model2-a1915937.jpg" alt="The machines of 2538" loading="lazy"></a><figcaption><b>The machines of 2538.</b> One family, from p048: every machine a dome-case on a lifting disc, with tentacles hung from the framework between. X-5638, X-6349, X-6621 and C-R-21, the four who speak in the council, each told by its build and stencilled with its designation; F-1, the shining cylinder, vast beside them. A man for scale.</figcaption></figure>
<figure><a href="img/model3-bdb30241.jpg"><img src="img/model3-bdb30241.jpg" alt="F-2, and C-R-U-1" loading="lazy"></a><figcaption><b>F-2, and C-R-U-1.</b> F-2 from the side, the front and above: a small torpedo of bluish metal with three thin tentacles. Newborn in its aura; old and oxidised, as the narrator is. C-R-U-1, the family form with neither disc nor tentacles, its name in dully glowing gold.</figcaption></figure>
<figure><a href="img/model4-c5d44ab0.jpg"><img src="img/model4-c5d44ab0.jpg" alt="The Outsiders" loading="lazy"></a><figcaption><b>The Outsiders.</b> Front and side, in the suit: short, squat, four-limbed, armoured in horny brown plates, three eyes on turrets around the crown, a third of a turn apart. The crown from above, and one beside a man.</figcaption></figure>
<figure><a href="img/model5-b4726fba.jpg"><img src="img/model5-b4726fba.jpg" alt="Ships, investigators and motes" loading="lazy"></a><figcaption><b>Ships, investigators and motes.</b> A torpedo of the void, with its projector turrets and drive bells, and from ahead. An investigator, three inches across. The motes, ten thousand tiny machine-ships: the family form on its side.</figcaption></figure>
<figure><a href="img/model6-68b3b118.jpg"><img src="img/model6-68b3b118.jpg" alt="The places" loading="lazy"></a><figcaption><b>The places.</b> The power plant at five hundred feet, with a man at its foot; the black dome cut away, with Roal and Trest under it and the violet beam that holds it; the Denver laboratory's hall of screens.</figcaption></figure>
