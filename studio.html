<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Last Evolution studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Bebas+Neue&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #EDE3CC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- a chapter (studio.html?chapter=5): its timeline from tools/timeline.mjs, before config.js takes its length from it -->
<script>
  const chq = new URLSearchParams(location.search).get('chapter'); window.CH = (chq || '').padStart(2, '0');
  if (chq) document.write(`<script src="src/gen/ch${CH}.js"><\/script><script>window.CHAPTER = CHAPTER<\/script>`);
</script>
<!-- engine (Claude Animation Base) -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/timeline.js"></script>
<!-- the film's medium: pulp paper and ink wash, and energy, the only colour (PLAN.md §5) -->
<script src="src/pulp.js"></script>
<script src="src/energy.js"></script>
<!-- the designs (PLAN.md §5), built from the text: people, machines, Outsiders, ships, places -->
<script src="src/designs.js"></script>
<!-- what the chapters share (from the pilot): timing, acting, thought, grounds, the chapter page, the camera -->
<script src="src/kit.js"></script>
<!-- the scene: a chapter's (src/scenes/chNN.js), or without one the toolchain's smoke test -->
<script>document.write(window.CHAPTER ? `<script src="src/scenes/ch${CH}.js"><\/script>` : '<script src="src/scenes/smoke.js"><\/script>');</script>
<!-- Phase 4's style frames, as loops: ?loop=look1 … look6, lookTitle -->
<script src="src/scenes/lookdev.js"></script>
<!-- Phase 4's model sheets: ?loop=model1 … model6 -->
<script src="src/scenes/models.js"></script>
<script>
  // studio.html?loop=<name> scrubs a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
