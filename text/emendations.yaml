# emendations.yaml: where the film's text differs from Gutenberg's, restoring the first printing (Amazing Stories, August
# 1932) where the 1961 reprint Gutenberg transcribed lost or changed words. Round 2 decided this (DECISIONS.md), and
# text/comparison_1932.md gives the evidence; the numbers are its item numbers. Gutenberg's own corrections of errors
# both printings share (items 17–19: F-1 for F-2, Deimos, Rulers') are kept as Gutenberg has them.
#   para       the paragraph
#   gutenberg  words in Gutenberg's text, found exactly once in that paragraph
#   first      what the 1932 printing has in their place, checked against the scan
#   mark       the words the site's Read page highlights as restored (none where 1932 simply lacks a word)
#   scan       the crop of the 1932 page that shows it
# text/source/pg27462.txt is never changed. tools/extract_story.mjs applies these to make text/story.json, and
# tools/verbatim_check.mjs holds the script to Gutenberg plus exactly these changes.
