# refs.yaml: every source the site's notes cite. The notes link to them as [text][id]; `npm run refs` checks that every id
# used is here, that every URL answers, and writes the link definitions at the foot of each note, so the notes render
# on GitHub too. Phase 4 adds what the film needs for its QR codes (PLAN.md §8): an r/ slug, a caption, the chapter and
# the cue phrase.
#   id:  {url, title, kind}     kind: primary (the thing itself), reference (an encyclopedia or index), secondary

# The story and its printings
