# speakers.yaml: who speaks each quoted span of the story (PLAN.md §3, rule 2). Everything outside quotation marks is the
# narrator's, so only paragraphs with quotation marks are listed, and each lists one speaker per span, in order.
#   p037: [x5638]                               one span, spoken aloud
#   p062: [f2 thought]                          heard as thought ("waves of thought"), not sound
#   p036: {who: [roal], sure: no, why: …}       an attribution the text leaves open: it goes on the next round's sheet
# A span that a paragraph leaves open (no closing quotation mark) runs on into the next paragraph's, and the check
# insists both name the same speaker. Ids are script/cast.yaml's. tools/build_script.mjs turns this into script.yaml.

