# sound.yaml: Round 3's sound sketches (PLAN.md §4). Everything is generated by ElevenLabs (music and sound effects) from
# these prompts, never borrowed. tools/sound_sampler.mjs makes them and the page at /review/round3/sound.html. The
# chosen motif and effects, with their cues and levels, move to script/sfx.yaml in the pilot (Phase 5).

# The motif: a short theremin-led cue for each chapter's head, the title and the credits. Three directions.
motif:
  A:
    name: wistful
    prompt: >-
      A short instrumental cue for a 1930s science-fiction radio serial. A solo theremin sings a slow, wistful,
      haunting melody in a minor key over soft muted strings. Mysterious and melancholy, intimate, ending on an
      unresolved note. No drums, no vocals.
    seconds: 14
  B:
    name: cosmic
    prompt: >-
      A short instrumental cue evoking cosmic wonder in a 1930s science-fiction film. A theremin melody floats over
      celesta, harp and vibraphone, glittering and eerie, slow and spacious, ending softly. No drums, no vocals.
    seconds: 14
  C:
    name: monumental
    prompt: >-
      A short instrumental cue for an epic of machines in a 1930s science-fiction film. A theremin melody over a low
      pipe-organ drone and a distant timpani roll, grand, solemn and ominous, ending on a sustained chord. No vocals.
    seconds: 14

# Effects: the story's own sounds, one sketch each. `where` is the paragraph that names the sound.
effects:
  workshop:
    where: p059
    prompt: >-
      A weird symphony in a futuristic laboratory: the whine of transmuted air, sputtering electric welding, sudden
      crashing electric arcs and the deep hum of powerful generators, all together
    seconds: 10
  birth:
    where: p060
    prompt: >-
      Generators roar into life; a great aura of white light crackling with streamers of blue electric lightning,
      sizzling arcs and roaring power
    seconds: 7
  snap:
    where: p060
    prompt: A dull electrical snap, then a heavy metal machine falling to a laboratory floor with a clang
    seconds: 3
  green-beam:
    where: p024
    prompt: A faint, wavering, sickly electrical hum of a pale green energy ray sweeping slowly over the land
    seconds: 6
  violet-beam:
    where: p095
    prompt: A steady, straining, bright electric hum of a violet energy beam pushing up against a dome of force
    seconds: 6
  power-plant:
    where: p115
    prompt: A dull, drumming beat that rises and becomes a low-pitched electrical hum, then quiets to a whisper
    seconds: 8
  storm:
    where: p117
    prompt: >-
      A violent storm raised by a giant machine: howling, shrieking wind, driving rain on metal and rock, crashing
      lightning, and a pulsing core of energy
    seconds: 10
  red-beam:
    where: p121
    prompt: An enormous deep red energy beam, a deep roaring drone that rises in pitch as it strains and then fades away
    seconds: 6
  golden-sphere:
    where: p124
    prompt: A vast, calm, deep, resonant shimmering tone, immense power held gently in check, slowly pulsing
    seconds: 8
