      - id: p046.1
        who: cr21
        text: '"Man is doomed, if these beams cannot be stopped,"'
      - id: p046.2
        who: narrator
        text: said C-R-21, present chief of the machine rulers, in the vibrationally correct, emotionless tones of all the race of machines.
        say: said C R two one, present chief of the machine rulers, in the vibrationally correct, emotionless tones of all the race of machines.
      - id: p046.3
        who: cr21
        text: '"Let us concentrate on the two problems of stopping the beams, and the Ultimate Energy till the reenforcements, still several days away, can arrive."'
      - id: p046.4
        who: narrator
        text: For the investigators had sent back this saddening news. A force of nearly ten thousand great ships was still to come.
      - id: p047.1
        who: narrator
        text: In the great Laboratories, the scientists reassembled. There, they fell to work in two small, and one large group. One small group investigated the secret of the Ultimate Energy of annihilation of matter under Roal, another investigated the beams, under Trest.
      - id: p048.1
        who: narrator
        text: But under the direction of MX-3401, nearly all the machines worked on a single great plan. The usual driving and lifting units were there, but a vastly greater dome-case, far more powerful energy-generators, far greater force-beam controls were used and more tentacles were built on the framework. Then all worked, and gradually, in the great dome-case, there were stacked the memory-units of the new type, and into these fed all the sensation-ideas of all the science-machines, till nearly a tenth of them were used. Countless billions of different factors on which to work, countless trillions of facts to combine and recombine in the extrapolation that is imagination.
        say: But under the direction of M X three four oh one, nearly all the machines worked on a single great plan. The usual driving and lifting units were there, but a vastly greater dome-case, far more powerful energy-generators, far greater force-beam controls were used and more tentacles were built on the framework. Then all worked, and gradually, in the great dome-case, there were stacked the memory-units of the new type, and into these fed all the sensation-ideas of all the science-machines, till nearly a tenth of them were used. Countless billions of different factors on which to work, countless trillions of facts to combine and recombine in the extrapolation that is imagination.
      - id: p049.1
        who: narrator
        text: Then--a widely different type of thought-combine, and a greater sense-receptor. It was a new brain-machine. New, for it was totally different, working with all the vast knowledge accumulated in six centuries of intelligent research by man, and a century of research by man and machine. No one branch, but all physics, all chemistry, all life-knowledge, all science was in it.
      - id: p050.1
        who: narrator
        text: A day--and it was finished. Slowly the rhythm of thought was increased, till the slight quiver of consciousness was reached. Then came the beating drum of intelligence, the radiation of its yet-uncontrolled thoughts. Quickly as the strings of its infinite knowledge combined, the radiation ceased. It gazed about it, and all things were familiar in its memory.
  - n: 5
    title: The Hydrogen Wall
    paras: p051–p073
    words: 1059
    lines:
      - id: p051.1
        who: narrator
        text: Roal was lying quietly on a couch. He was thinking deeply, and yet not with the logical trains of thought that machines must follow.
      - id: p052.1
        who: f1
        text: '"Roal--your thoughts,"'
      - id: p052.2
        who: narrator
        text: called F-1, the new machine.
        say: called F one, the new machine.
      - id: p053.1
        who: narrator
        text: Roal sat up.
      - id: p053.2
        who: roal
        text: '"Ah--you have gained consciousness."'
      - id: p054.1
        who: f1
        text: '"I have. You thought of hydrogen? Your thoughts ran swiftly, and illogically, it seemed, but I followed slowly, and find you were right. Hydrogen is the start. What is your thought?"'
      - id: p055.1
        who: narrator
        text: Roal's eyes dreamed. In human eyes there was always the expression of thought that machines never show.
      - id: p056.1
        who: roal
        text: "\"Hydrogen, an atom in space; but a single proton; but a single electron; each indestructible; each mutually destroying. Yet never do they collide. Never in all science, when even electrons bombard atoms with the awful expelling force of the exploding atom behind them, never do they reach the proton, to touch and annihilate it. Yet--the proton is positive and attracts the electron's negative charge. A hydrogen atom--its electron far from the proton falls in, and from it there goes a flash of radiation, and the electron is nearer to the proton, in a new orbit. Another flash--it is nearer. Always falling nearer, and only constant force will keep it from falling to that one state--then, for some reason no more does it drop. Blocked--held by some imponderable, yet impenetrable wall. What is that wall--why?"
      - id: p057.1
        who: roal
        text: '"Electric force curves space. As the two come nearer, the forces become terrific; nearer they are; more terrific. Perhaps, if it passed within that forbidden territory, the proton and the electron curve space beyond all bounds--and are in a new space."'
        continues: true
      - id: p057.2
        who: narrator
        text: Roal's soft voice dropped to nothing, and his eyes dreamed.
      - id: p058.1
        who: narrator
        text: F-1 hummed softly in its new-made mechanism.
        say: F one hummed softly in its new-made mechanism.
      - id: p058.2
        who: f1
        text: '"Far ahead of us there is a step that no logic can justly ascend, but yet, working backwards, it is perfect."'
      - id: p058.3
        who: narrator
        text: F-1 floated motionless on its anti-gravity drive. Suddenly, force shafts gleamed out, tentacles became writhing masses of rubber-covered metal, weaving in some infinite pattern, weaving in flashing speed, while the whirr of air sucked into a transmutation field, whined and howled about the writhing mass. Fierce beams of force drove and pushed at a rapidly materializing something, while the hum of the powerful generators within the shining cylinder of F-1 waxed and waned.
        say: F one floated motionless on its anti-gravity drive. Suddenly, force shafts gleamed out, tentacles became writhing masses of rubber-covered metal, weaving in some infinite pattern, weaving in flashing speed, while the whirr of air sucked into a transmutation field, whined and howled about the writhing mass. Fierce beams of force drove and pushed at a rapidly materializing something, while the hum of the powerful generators within the shining cylinder of F one waxed and waned.
      - id: break04
        shown: break
        text: "*       *       *       *"
      - id: p059.1
        who: narrator
        text: Flashes of fierce flame, sudden crashing arcs that glowed and snapped in the steady light of the laboratory, and glimpses of white-hot metal supported on beams of force. The sputter of welding, the whine of transmuted air, and the hum of powerful generators, blasting atoms were there. All combined to a weird symphony of light and dark, of sound and quiet. About F-1 were clustered floating tiers of science-machines, watching steadily.
        say: Flashes of fierce flame, sudden crashing arcs that glowed and snapped in the steady light of the laboratory, and glimpses of white-hot metal supported on beams of force. The sputter of welding, the whine of transmuted air, and the hum of powerful generators, blasting atoms were there. All combined to a weird symphony of light and dark, of sound and quiet. About F one were clustered floating tiers of science-machines, watching steadily.
      - id: p060.1
        who: narrator
        text: The tentacles writhed once more, straightened, and rolled back. The whine of generators softened to a sigh, and but three beams of force held the structure of glowing, bluish metal. It was a small thing, scarcely half the size of Roal. From it curled three thin tentacles of the same bluish metal. Suddenly the generators within F-1 seemed to roar into life. An enormous aura of white light surrounded the small torpedo of metal, and it was shot through with crackling streamers of blue lightning. Lightning cracked and roared from F-1 to the ground near him, and to one machine which had come too close. Suddenly, there was a dull snap, and F-1 fell heavily to the floor, and beside him fell the fused, distorted mass of metal that had been a science-machine.
