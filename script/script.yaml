      - id: p134.1
        who: narrator
        text: Forces gripped the mighty ship, and as some fragile toy it twisted and bent, and yet was not hurt. In awful wonder those Outsiders saw the ship turned inside out, and yet it was whole, and no part damaged. They saw the ship restored, and its great screen of blankness out, protecting it from all known rays. The ship twisted, and what they knew were curves, yet were lines, and angles that were acute, were somehow straight lines. Half mad with horror, they saw the sphere send out a beam of blue-white radiance, and it passed easily through that screen, and through the ship, and all energies within it were instantly locked. They could not be changed; it could be neither warmed nor cooled; what was open could not be shut, and what was shut could not be opened. All things were immovable and unchangeable for all time.
