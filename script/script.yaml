      - id: p132.1
        who: golden
        text: '"Life-form of greed, from another star you came, destroying forever the great race that created us, the Beings of Force and the Beings of Metal. Pure force am I. My Intelligence is beyond your comprehension, my memory is engraved in the very space, the fabric of space of which I am a part, mine is energy drawn from that same fabric.'
        mode: thought
      - id: p133.1
