        text: '"The secret of the force-screen is simple."'
      - id: p037.3
        who: narrator
        text: A small ray-machine, which had landed near, rose into the air at the command of the scientist-machine, X-5638 it was, and trained upon it the deadly induction beam. Already, with his parts, X-5638 had constructed the defensive apparatus, for the ray fell harmless from his screen.
        say: A small ray-machine, which had landed near, rose into the air at the command of the scientist-machine, X five six three eight it was, and trained upon it the deadly induction beam. Already, with his parts, X five six three eight had constructed the defensive apparatus, for the ray fell harmless from his screen.
      - id: p038.1
        who: roal
        text: '"Very good,"'
      - id: p038.2
        who: narrator
        text: said Roal softly.
      - id: p038.3
        who: roal
        text: '"It is done, and therein lies their danger. Already it is done.'
      - id: p039.1
        who: roal
        text: '"Man is a poor thing, unable to change himself in a period of less than thousands of years. Already you have changed yourself. I noticed your weaving tentacles, and your force-beams. You transmuted elements of soil for it?"'
        continues: true
      - id: p040.1
