# cast.yaml: who speaks in the film. Every quoted line in script/speakers.yaml names one of these ids; everything outside
# quotation marks is the narrator's (PLAN.md §3). The cast was chosen in Round 3: `pick` is the candidate chosen on the
# casting page (its preview id in script/casting_candidates.json), and `voice` the voice saved to the ElevenLabs account
# from it (tools/save_cast.mjs), once it's saved. F-2 in the scenes is the narrator's voice, untreated. `scratch` is the
# stock voice tools/scratch_voice.mjs used in Round 1, only to hear the words and time them.
